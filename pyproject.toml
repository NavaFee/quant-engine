[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-engine"
version = "0.1.0"
description = "Cryptocurrency research engine for data, strategies, and backtesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_engine*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
